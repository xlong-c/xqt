config_version: 1

project:
  name: structured_prune_kd_cpu
  artifact_dir: artifacts/xqt/structured_prune_kd_cpu

model:
  target: xdl.model.VisionTransformer
  params:
    img_size: 32
    patch_size: 8
    num_classes: 5
    in_channels: 3
    embed_dim: 32
    depth: 4
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    attn_dropout: 0.0
  dtype: float32
  device: cpu

data:
  train:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      input_shape: [3, 32, 32]
      num_classes: 5
      seed: 31
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      input_shape: [3, 32, 32]
      num_classes: 5
      seed: 37

compression:
  axes:
    - width
    - depth
  quant:
    enabled: false
  prune:
    enabled: true
    method: structured
    granularity: mlp_neuron
    scope: per_layer
    target_sparsity: 0.25
    schedule: one_shot
    importance:
      metric: l2
    selection:
      min_keep: 1
    params:
      finetune: true
      kd_steps_per_prune: 1
      steps: 1
      lr: 1.0e-2
      weight_decay: 0.0
  distill:
    enabled: false
    temperature: 2.0
    alpha: 0.5
  diffusion_distill:
    enabled: false

export:
  targets:
    - format: onnx
      output_path: artifacts/xqt/structured_prune_kd_cpu/model.onnx
      params:
        runtime_diff: false

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.2

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

config_version: 1

project:
  name: xqt_smoke_cpu
  artifact_dir: artifacts/xqt/smoke_cpu

model:
  target: torch.nn.Linear
  params:
    in_features: 4
    out_features: 2
  dtype: float32
  device: cpu

data:
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2

compression:
  axes:
    - precision
    - sparsity
  quant:
    enabled: false
    backend: torchao
    policy:
      dtype: int8
      include_module_types:
        - Linear
      exclude_name_patterns:
        - head
  prune:
    enabled: true
    method: global_l1_unstructured
    target_sparsity: 0.5
  distill:
    enabled: false
  diffusion_distill:
    enabled: false
    teacher_steps: 20
    student_steps: 4

export:
  targets:
    - format: torch_export
      output_path: artifacts/xqt/smoke_cpu/model.pt2
      params:
        validate: true
        runtime_diff: true

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.01

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

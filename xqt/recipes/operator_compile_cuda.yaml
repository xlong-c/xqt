config_version: 1

project:
  name: operator_compile_cuda
  artifact_dir: artifacts/xqt/operator_compile_cuda

model:
  target: torch.nn.Linear
  params:
    in_features: 8
    out_features: 2
  dtype: float32
  device: cuda

data:
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      input_shape: [8]
      num_classes: 2

compression:
  axes:
    - precision
  quant:
    enabled: false
  prune:
    enabled: false
  distill:
    enabled: false
  diffusion_distill:
    enabled: false

operator_optimization:
  enabled: true
  stage: after_compression
  default_backend: torch_compile
  targets:
    - name: model
      backend: torch_compile
      mode: reduce-overhead
      fullgraph: false
      dynamic: false
      options:
        backend: inductor
      fallback: eager
      min_speedup: 1.000001
      validate:
        atol: 1.0e-5
        rtol: 1.0e-5

export:
  targets: []

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5

benchmark:
  warmup: 1
  iterations: 3
  percentiles: [50, 90, 99]
  sync_cuda: true
  measure_memory: true

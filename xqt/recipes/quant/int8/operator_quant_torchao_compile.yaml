project:
  name: quant_int8_torchao_compile
  artifact_dir: artifacts/xqt/quant/int8/torchao_compile
model:
  target: xqt.kernels.nn.fixtures.toy_models.build_hetero_quant_toy_model
  params:
    in_features: 4
    hidden_features: 4
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - torchao
  - torch_compile
stages:
- name: quant_model
  kind: quant
  params:
    backend: torchao
    strategy: w8a8_int8
    policy:
      include_module_types:
      - Linear
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: model
      engine: torch_compile
      mode: reduce-overhead
      min_speedup: 1.000001
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

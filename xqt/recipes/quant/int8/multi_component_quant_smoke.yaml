config_version: 1

project:
  name: quant_int8_multi_component_smoke
  artifact_dir: artifacts/xqt/quant/int8/multi_component_smoke

model:
  target: xqt.quant.toy_models.build_hetero_quant_toy_model
  params:
    in_features: 4
    hidden_features: 4
    num_classes: 2
  dtype: float32
  device: cpu

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: torchao
    strategy: dynamic_int8
    component_policies:
      - name: vision_encoder
        target: vision_encoder
        backend: onnxruntime_qdq
        strategy: static_int8
        policy:
          input_names: [input]
          sample_limit: 1
      - name: projector
        target: projector
        backend: torchao
        analysis_only: true
        keep_high_precision: [projector]
      - name: decoder
        target: decoder
        backend: torchao
        strategy: dynamic_int8
        skip_quantize: []
        force_quantize: [decoder]
    policy:
      include_module_types: [Linear]

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.1

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

project:
  name: quant_int8_multi_component_smoke
  artifact_dir: artifacts/xqt/quant/int8/multi_component_smoke
model:
  target: xqt.quant.toy_models.build_hetero_quant_toy_model
  params:
    in_features: 4
    hidden_features: 4
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - torchao
stages:
- name: quant_model
  kind: quant
  params:
    backend: torchao
    strategy: dynamic_int8
    component_policies:
    - name: vision_encoder
      target: vision_encoder
      backend: onnxruntime_qdq
      strategy: static_qdq_int8
      policy:
        input_names:
        - input
        sample_limit: 1
    - name: projector
      target: projector
      backend: torchao
      analysis_only: true
      keep_high_precision:
      - projector
    - name: decoder
      target: decoder
      backend: torchao
      strategy: dynamic_int8
      skip_quantize: []
      force_quantize:
      - decoder
    policy:
      include_module_types:
      - Linear
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

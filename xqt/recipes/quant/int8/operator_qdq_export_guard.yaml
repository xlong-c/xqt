project:
  name: quant_int8_qdq_export_guard
  artifact_dir: artifacts/xqt/quant/int8/qdq_export_guard
model:
  target: xqt.kernels.nn.fixtures.toy_models.build_hetero_quant_toy_model
  params:
    in_features: 4
    hidden_features: 4
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - onnxruntime_qdq
  - torch_compile
  - onnx
stages:
- name: quant_model
  kind: quant
  params:
    backend: onnxruntime_qdq
    strategy: w8a8_int8
    policy:
      input_names:
      - input
      sample_limit: 1
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: model
      engine: torch_compile
      min_speedup: 1.000001
- name: export_model
  kind: export
  save_model: false
  params:
    targets:
    - format: onnx
      output_path: artifacts/xqt/quant/int8/qdq_export_guard/model.onnx
      onnx:
        runtime_diff: false
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

project:
  name: quant_int8_qdq_export_guard
  artifact_dir: artifacts/xqt/quant/int8/qdq_export_guard

model:
  target: xqt.quant.toy_models.build_hetero_quant_toy_model
  params:
    in_features: 4
    hidden_features: 4
    num_classes: 2

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: onnxruntime_qdq
    strategy: static_int8
    policy:
      input_names: [input]
      sample_limit: 1

operator_optimization:
  enabled: true
  targets:
    - name: model
      backend: torch_compile
      min_speedup: 1.000001

export:
  targets:
    - format: onnx
      output_path: artifacts/xqt/quant/int8/qdq_export_guard/model.onnx
      params:
        runtime_diff: false

benchmark:
  warmup: 0
  iterations: 1

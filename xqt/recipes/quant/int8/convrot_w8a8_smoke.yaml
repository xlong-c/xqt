project:
  name: convrot_w8a8_smoke
  artifact_dir: artifacts/xqt/quant/int8/convrot_w8a8_smoke
model:
  target: xqt.operator_opt.toy_models.build_toy_linear_block
  params:
    input_dim: 16
    hidden_dim: 32
    output_dim: 8
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
  - precision
hardware:
  device: cpu
  backends:
    - pytorch
stages:
  - name: convrot_w8a8_quant
    kind: quant
    params:
      backend: pytorch
      method: convrot
      strategy: w8a8_int8
      compute: w8a8_int8_mma
      policy:
        dtype: int8
        scheme: convrot_w8a8
        include_module_names:
          - linear
        rot_size: 4
        activation_scale_mode: dynamic
  - name: benchmark_model
    kind: benchmark
    params:
      warmup: 0
      iterations: 1

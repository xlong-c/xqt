project:
  name: quant_int8_resnet_cifar100_qdq
  artifact_dir: artifacts/xqt/quant/int8/resnet_cifar100_qdq
model:
  target: xdl.model.resnet18
  params:
    num_classes: 100
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - onnxruntime_qdq
stages:
- name: quant_model
  kind: quant
  params:
    backend: onnxruntime_qdq
    strategy: w8a8_int8
    keep_high_precision:
    - head
    policy:
      source_name: resnet18_cifar100_source.onnx
      output_path: artifacts/xqt/quant/int8/resnet_cifar100_qdq/resnet18_cifar100_qdq.onnx
      input_names:
      - input
      output_names:
      - output
      sample_limit: 2
      activation_type: QUInt8
      weight_type: QInt8
      op_types_to_quantize:
      - Conv
      - MatMul
      - Gemm
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

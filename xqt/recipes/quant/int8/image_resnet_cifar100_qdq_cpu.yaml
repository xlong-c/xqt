config_version: 1

project:
  name: quant_int8_resnet_cifar100_qdq
  artifact_dir: artifacts/xqt/quant/int8/resnet_cifar100_qdq

model:
  target: xdl.model.resnet18
  params:
    num_classes: 100
  dtype: float32
  device: cpu

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: onnxruntime_qdq
    strategy: static_int8
    keep_high_precision: [head]
    policy:
      source_name: resnet18_cifar100_source.onnx
      output_path: artifacts/xqt/quant/int8/resnet_cifar100_qdq/resnet18_cifar100_qdq.onnx
      input_names: [input]
      output_names: [output]
      sample_limit: 2
      activation_type: QUInt8
      weight_type: QInt8
      op_types_to_quantize: [Conv, MatMul, Gemm]

validation:
  output_diff:
    atol: 1.0e-3
    rtol: 1.0e-3

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

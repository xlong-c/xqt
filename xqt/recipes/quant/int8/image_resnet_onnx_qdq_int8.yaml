project:
  name: quant_int8_resnet_onnx_qdq
  artifact_dir: artifacts/xqt/quant/int8/resnet_onnx_qdq

model:
  target: xdl.model.resnet18
  params:
    num_classes: 10

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: onnxruntime_qdq
    strategy: static_int8
    keep_high_precision: [head]
    policy:
      source_name: resnet18_source.onnx
      output_path: artifacts/xqt/quant/int8/resnet_onnx_qdq/resnet18_qdq.onnx
      input_names: [input]
      output_names: [output]
      sample_limit: 2
      activation_type: QUInt8
      weight_type: QInt8
      op_types_to_quantize: [Conv, MatMul, Gemm]

export:
  targets:
    - format: tensorrt
      output_path: artifacts/xqt/quant/int8/resnet_onnx_qdq/resnet18_int8.engine
      precision: int8
      params:
        dry_run: true
        performance_thresholds:
          throughput_qps_min: 1.0
          latency_p99_ms_max: 10.0
          gpu_compute_time_p99_ms_max: 10.0

validation:
  output_diff:
    atol: 1.0e-3
    rtol: 1.0e-3

benchmark:
  warmup: 0
  iterations: 1

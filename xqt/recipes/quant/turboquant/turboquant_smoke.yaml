project:
  name: turboquant_smoke
  artifact_dir: artifacts/xqt/quant/turboquant/turboquant_smoke
model:
  target: xqt.kernels.nn.fixtures.toy_models.build_toy_linear_block
  params:
    input_dim: 16
    hidden_dim: 32
    output_dim: 8
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
  - precision
hardware:
  device: cpu
  backends:
    - pytorch
stages:
  - name: turboquant_quant
    kind: quant
    params:
      backend: pytorch
      method: turboquant
      strategy: w4a16_fp4
      compute: dequant_fp16
      policy:
        bits: 3
        mode: mse
        rotation_kind: randomized_hadamard
        include_module_names:
          - linear
          - proj
  - name: benchmark_model
    kind: benchmark
    params:
      warmup: 0
      iterations: 1

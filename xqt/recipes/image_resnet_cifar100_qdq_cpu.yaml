config_version: 1

project:
  name: image_resnet_cifar100_qdq_cpu
  artifact_dir: artifacts/xqt/image_resnet_cifar100_qdq_cpu

model:
  target: xdl.model.resnet18
  params:
    num_classes: 100
  dtype: float32
  device: cpu

data:
  calibration:
    target: torchvision_image_classification
    root: data
    sample_limit: 2
    batch_size: 1
    params:
      dataset_name: CIFAR100
      train: false
      download: false
      transform_params:
        image_size: 224
        mean: [0.5071, 0.4867, 0.4408]
        std: [0.2675, 0.2565, 0.2761]
  validation:
    target: torchvision_image_classification
    root: data
    sample_limit: 2
    batch_size: 1
    params:
      dataset_name: CIFAR100
      train: false
      download: false
      transform_params:
        image_size: 224
        mean: [0.5071, 0.4867, 0.4408]
        std: [0.2675, 0.2565, 0.2761]

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: onnxruntime_qdq
    policy:
      source_name: resnet18_cifar100_source.onnx
      output_path: artifacts/xqt/image_resnet_cifar100_qdq_cpu/resnet18_cifar100_qdq.onnx
      input_names: [input]
      output_names: [output]
      sample_limit: 2
      activation_type: QUInt8
      weight_type: QInt8
      op_types_to_quantize: [Conv, MatMul, Gemm]
  prune:
    enabled: false
  distill:
    enabled: false
  diffusion_distill:
    enabled: false

export:
  targets: []

validation:
  output_diff:
    atol: 1.0e-3
    rtol: 1.0e-3
  metric:
    name: top1
    max_drop: 0.05

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

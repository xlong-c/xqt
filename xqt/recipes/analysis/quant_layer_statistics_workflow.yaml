project:
  name: quant_layer_statistics_workflow
  artifact_dir: artifacts/xqt/analysis/quant_layer_statistics_workflow
model:
  target: xqt.kernels.nn.fixtures.toy_models.build_toy_fp4_mlp
  params:
    hidden_dim: 64
stages:
- name: fp4_quant
  kind: quant
  params:
    backend: pytorch
    method: awq
    strategy: w4a16_fp4
    policy:
      dtype: fp4
      scheme: weight_only
      include_module_names:
      - fc1
      group_size: 64
- name: analyze_quant_error
  kind: analyze
  from_stage: fp4_quant
  save_model: false
  params:
    compare_to: baseline
    module_names:
    - fc1
    - fc2
    metrics:
    - max_abs
    - mean_abs
    - cosine_similarity
    - snr_db
    include_weight_diff: true
    include_statistics: true
    sample_budget: 256
    sample_seed: 0
    histogram_bins: 16
    recommendations:
      mixed_precision: true
      prune_candidates: true
    export:
      json: true
      csv: true
      markdown: true
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - pytorch

project:
  name: yolo_detection_practice
  artifact_dir: artifacts/xqt/detection/yolo_practice

model:
  target: xqt.model.build_smoke_detection_module
  params:
    num_classes: 80
    input_channels: 3
  dtype: float32
  device: cpu

task:
  type: detection
  detection_postprocess:
    format: yolo_raw
    box_format: cxcywh
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 300
    score_activation: sigmoid
    has_objectness: false
    class_agnostic_nms: false
  detection_metric:
    iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
    max_detections: 100
  params:
    imgsz: 640

stages:
  - name: baseline_eval
    kind: eval
    params:
      baseline: true

  - name: baseline_latency
    kind: benchmark
    params:
      warmup: 2
      iterations: 5

  - name: export_fp32_onnx
    kind: export
    save_model: false
    params:
      targets:
        - format: onnx
          output_path: artifacts/xqt/detection/yolo_practice/export_fp32_onnx/smoke_detection_fp32.onnx
          opset: 18
          params:
            input_names: [images]
            output_names: [predictions]
            dynamo: false
            runtime_diff: false

  - name: fp32_onnx_runtime
    kind: runtime_eval
    compare_to: baseline_eval
    save_model: false
    params:
      artifact: last_onnx
      input_names: [images]
      max_batches: 4
      warmup: 0
      iterations: 1
    accept:
      metric: map50_95
      max_drop: 0.10
      max_mean_abs: 5.0e-2
      max_max_abs: 5.0e-1

  - name: quant_qdq
    kind: quant
    save_model: false
    params:
      backend: onnxruntime_qdq
      strategy: static_int8
      policy:
        source_name: smoke_detection_source.onnx
        output_path: artifacts/xqt/detection/yolo_practice/quant_qdq/smoke_detection_qdq.onnx
        input_names: [images]
        output_names: [predictions]
        dynamo: false
        sample_limit: 4
        activation_type: QUInt8
        weight_type: QInt8
        op_types_to_quantize: [Conv, MatMul, Gemm]
        extra_options:
          ActivationSymmetric: false

  - name: qdq_onnx_runtime
    kind: runtime_eval
    compare_to: baseline_eval
    save_model: false
    params:
      artifact: quant_onnx
      input_names: [images]
      max_batches: 4
      warmup: 0
      iterations: 1
    accept:
      metric: map50_95
      max_drop: 0.10
      max_mean_abs: 2.5e-1
      max_max_abs: 2.5

  - name: prune_sparse
    kind: prune
    from_stage: initial
    params:
      method: global_l1_unstructured
      target_sparsity: 0.2

  - name: prune_eval
    kind: eval
    compare_to: baseline_eval
    params:
      baseline: false
    accept:
      metric: map50_95
      max_drop: 0.10

  - name: prune_latency
    kind: benchmark
    compare_to: baseline_latency
    params:
      warmup: 1
      iterations: 3

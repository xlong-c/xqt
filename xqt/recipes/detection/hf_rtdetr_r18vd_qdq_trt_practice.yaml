project:
  name: hf_rtdetr_r18vd_qdq_trt_practice
  artifact_dir: artifacts/xqt/detection/hf_rtdetr_r18vd_qdq_trt_practice

task:
  type: detection
  detection_postprocess:
    format: auto
    box_format: cxcywh
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 300
    score_activation: sigmoid
    has_objectness: false
    class_agnostic_nms: false
  detection_metric:
    iou_thresholds: [0.5, 0.75, 0.95]
    max_detections: 300
  params:
    imgsz: 640

data_splits:
  calibration:
    target: synthetic_detection
    sample_limit: 2
    batch_size: 1
    params:
      image_shape: [3, 640, 640]
      num_classes: 80
      boxes_per_image: 3
      seed: 62
      include_model_inputs: true
      input_image_key: pixel_values
  validation:
    target: synthetic_detection
    sample_limit: 2
    batch_size: 1
    params:
      image_shape: [3, 640, 640]
      num_classes: 80
      boxes_per_image: 3
      seed: 63
      include_model_inputs: true
      input_image_key: pixel_values

stages:
  - name: quant_qdq
    kind: quant
    calibration_split: calibration
    validation_split: validation
    save_model: false
    params:
      backend: onnxruntime_qdq
      strategy: static_int8
      policy:
        onnx_path: /root/others/rtdetr-artifacts/onnx-community-rtdetr_r18vd-direct.onnx
        output_path: artifacts/xqt/detection/hf_rtdetr_r18vd_qdq_trt_practice/quant/hf_rtdetr_r18vd_qdq.onnx
        input_names: [pixel_values]
        op_types_to_quantize: [Conv, MatMul]
        activation_type: QUInt8
        weight_type: QInt8
        sample_limit: 2

  - name: build_trt_int8_engine
    kind: deploy
    split: validation
    save_model: false
    params:
      targets:
        - format: tensorrt
          output_path: artifacts/xqt/detection/hf_rtdetr_r18vd_qdq_trt_practice/deploy/hf_rtdetr_r18vd_qdq.engine
          precision: int8
          profiles:
            pixel_values:
              min: [1, 3, 640, 640]
              opt: [1, 3, 640, 640]
              max: [1, 3, 640, 640]
          params:
            backend: python_api
            dry_run: true
            onnx_path: artifacts/xqt/detection/hf_rtdetr_r18vd_qdq_trt_practice/quant/hf_rtdetr_r18vd_qdq.onnx
            runtime_benchmark:
              enabled: false
              input_shapes:
                pixel_values: [1, 3, 640, 640]
              warmup: 10
              iterations: 50
              device: cuda:0

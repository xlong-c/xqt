project:
  name: external_detection_trt_deploy
  artifact_dir: artifacts/xqt/detection/external_detection_trt_deploy

task:
  type: detection
  detection_postprocess:
    format: yolo_raw
    box_format: cxcywh
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 300
    score_activation: sigmoid
    has_objectness: false
    class_agnostic_nms: false
  params:
    imgsz: 640

stages:
  - name: build_trt_engine
    kind: deploy
    save_model: false
    params:
      targets:
        - format: tensorrt
          output_path: artifacts/xqt/detection/external_detection_trt_deploy/deploy/external_detection.engine
          precision: int8
          profiles:
            images:
              min: [1, 3, 640, 640]
              opt: [1, 3, 640, 640]
              max: [1, 3, 640, 640]
          params:
            backend: python_api
            dry_run: true
            onnx_path: /tmp/xqt-external-detection.onnx
            runtime_benchmark:
              enabled: false
              input_shapes:
                images: [1, 3, 640, 640]
              warmup: 10
              iterations: 50
              device: cuda:0

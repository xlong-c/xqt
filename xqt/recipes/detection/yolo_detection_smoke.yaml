config_version: 1

project:
  name: detection_yolo_smoke
  artifact_dir: artifacts/xqt/detection/yolo_smoke

model:
  target: xqt.model.build_toy_detection_module
  params:
    num_classes: 3
    boxes_per_image: 2
  dtype: float32
  device: cpu

task:
  type: detection
  class_names: [cls0, cls1, cls2]
  detection_postprocess:
    format: yolo_raw
    box_format: xyxy
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 100
    score_activation: sigmoid
    has_objectness: false
    class_agnostic_nms: false
  detection_metric:
    iou_thresholds: [0.5, 0.75]
    max_detections: 100

data:
  calibration:
    target: synthetic_detection
    sample_limit: 2
    batch_size: 1
    params:
      image_shape: [3, 64, 64]
      num_classes: 3
      boxes_per_image: 2
  validation:
    target: synthetic_detection
    sample_limit: 2
    batch_size: 1
    params:
      image_shape: [3, 64, 64]
      num_classes: 3
      boxes_per_image: 2

compression:
  axes:
    - precision
    - sparsity
  prune:
    enabled: true
    method: global_l1_unstructured
    target_sparsity: 0.2

export:
  targets:
    - format: onnx
      output_path: artifacts/xqt/detection/yolo_smoke/toy_detection.onnx
      opset: 18
      params:
        input_names: [image]
        output_names: [predictions]
        dynamo: false
        runtime_diff: false
    - format: openvino
      output_path: artifacts/xqt/detection/yolo_smoke/toy_detection.xml
      precision: fp32
      params:
        dry_run: true
        input_shape: [1, 3, 64, 64]

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: map50_95
    max_drop: 0.05

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

project:
  name: yolo_detection_trt_qdq_practice
  artifact_dir: artifacts/xqt/detection/yolo_trt_qdq_practice

model:
  target: xqt.model.build_smoke_detection_module
  params:
    num_classes: 80
    input_channels: 3

task:
  type: detection
  detection_postprocess:
    format: yolo_raw
    box_format: cxcywh
    score_activation: sigmoid
  params:
    imgsz: 640

stages:
  - name: export_fp32_onnx
    kind: export
    save_model: false
    params:
      targets:
        - format: onnx
          output_path: artifacts/xqt/detection/yolo_trt_qdq_practice/export_fp32_onnx/smoke_detection_fp32.onnx
          opset: 18
          params:
            input_names: [images]
            output_names: [predictions]
            dynamo: false
            runtime_diff: false

  - name: quant_qdq
    kind: quant
    save_model: false
    params:
      backend: onnxruntime_qdq
      strategy: static_int8
      policy:
        source_name: smoke_detection_source.onnx
        output_path: artifacts/xqt/detection/yolo_trt_qdq_practice/quant_qdq/smoke_detection_qdq.onnx
        input_names: [images]
        output_names: [predictions]
        dynamo: false
        sample_limit: 4
        activation_type: QUInt8
        weight_type: QInt8
        op_types_to_quantize: [Conv]

  - name: build_trt_int8_engine
    kind: deploy
    save_model: false
    params:
      targets:
        - format: tensorrt
          output_path: artifacts/xqt/detection/yolo_trt_qdq_practice/deploy/smoke_detection_qdq.engine
          precision: int8
          profiles:
            images:
              min: [1, 3, 640, 640]
              opt: [1, 3, 640, 640]
              max: [1, 3, 640, 640]
          params:
            backend: python_api
            dry_run: true
            onnx_path: artifacts/xqt/detection/yolo_trt_qdq_practice/quant_qdq/smoke_detection_qdq.onnx
            runtime_benchmark:
              enabled: false
              input_shapes:
                images: [1, 3, 640, 640]
              warmup: 10
              iterations: 50
              device: cuda:0

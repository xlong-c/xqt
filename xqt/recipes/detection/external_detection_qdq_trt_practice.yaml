project:
  name: external_detection_qdq_trt_practice
  artifact_dir: artifacts/xqt/detection/external_detection_qdq_trt_practice

task:
  type: detection
  detection_postprocess:
    format: auto
    box_format: xyxy
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 300
    score_activation: identity
    has_objectness: false
    class_agnostic_nms: false
  params:
    imgsz: 640

stages:
  - name: quant_qdq
    kind: quant
    save_model: false
    params:
      backend: onnxruntime_qdq
      strategy: static_int8
      policy:
        onnx_path: /tmp/xqt-external-detection.onnx
        output_path: artifacts/xqt/detection/external_detection_qdq_trt_practice/quant/external_detection_qdq.onnx
        input_names: [images, orig_target_sizes]
        op_types_to_quantize: [Conv, MatMul]
        activation_type: QUInt8
        weight_type: QInt8
        sample_limit: 2

  - name: build_trt_int8_engine
    kind: deploy
    save_model: false
    params:
      targets:
        - format: tensorrt
          output_path: artifacts/xqt/detection/external_detection_qdq_trt_practice/deploy/external_detection_qdq.engine
          precision: int8
          profiles:
            images:
              min: [1, 3, 640, 640]
              opt: [1, 3, 640, 640]
              max: [1, 3, 640, 640]
            orig_target_sizes:
              min: [1, 2]
              opt: [1, 2]
              max: [1, 2]
          params:
            backend: python_api
            dry_run: true
            onnx_path: artifacts/xqt/detection/external_detection_qdq_trt_practice/quant/external_detection_qdq.onnx
            runtime_benchmark:
              enabled: false
              input_shapes:
                images: [1, 3, 640, 640]
                orig_target_sizes: [1, 2]
              warmup: 10
              iterations: 50
              device: cuda:0

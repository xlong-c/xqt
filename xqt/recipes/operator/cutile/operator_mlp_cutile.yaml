project:
  name: operator_cutile_mlp
  artifact_dir: artifacts/xqt/operator/cutile/mlp
model:
  target: xqt.kernels.nn.fixtures.toy_models.build_toy_llm_mlp_classifier
  params:
    hidden_dim: 8
    intermediate_dim: 16
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cuda
  backends:
  - cutile
stages:
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: mlp_cutile
      target: mlp
      engine: cutile
      patterns:
      - bias_silu
      min_speedup: 1.1
      validate:
        atol: 1e-4
        rtol: 1e-4
      cutile:
        target_arch: sm_89
        cache_dir: /tmp/xqt-cutile-cache
        pass_configs:
          CUTILE_ENABLE_FAST_MATH: true
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

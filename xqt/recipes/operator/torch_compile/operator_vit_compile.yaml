project:
  name: operator_torch_compile_vit
  artifact_dir: artifacts/xqt/operator/torch_compile/vit
model:
  target: xqt.model.toy_models.build_toy_transformer_classifier
  params:
    input_dim: 8
    hidden_dim: 8
    num_heads: 2
    dim_feedforward: 16
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cpu
  backends:
  - torch_compile
stages:
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: encoder_compile
      target: encoder
      engine: torch_compile
      mode: reduce-overhead
      dynamic: false
      options:
        engine: inductor
      min_speedup: 1.000001
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

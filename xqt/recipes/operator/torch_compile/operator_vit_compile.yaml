project:
  name: operator_torch_compile_vit
  artifact_dir: artifacts/xqt/operator/torch_compile/vit

model:
  target: xqt.operator_opt.toy_models.build_toy_transformer_classifier
  params:
    input_dim: 8
    hidden_dim: 8
    num_heads: 2
    dim_feedforward: 16
    num_classes: 2

compression:
  axes:
    - precision

operator_optimization:
  enabled: true
  targets:
    - name: encoder_compile
      target: encoder
      backend: torch_compile
      mode: reduce-overhead
      dynamic: false
      options:
        backend: inductor
      min_speedup: 1.000001

benchmark:
  warmup: 0
  iterations: 1

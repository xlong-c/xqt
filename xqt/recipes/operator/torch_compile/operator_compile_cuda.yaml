project:
  name: operator_torch_compile_cuda
  artifact_dir: artifacts/xqt/operator/torch_compile/cuda

model:
  target: torch.nn.Linear
  params:
    in_features: 8
    out_features: 2
  dtype: float32
  device: cuda

compression:
  axes:
    - precision

operator_optimization:
  enabled: true
  targets:
    - name: model
      backend: torch_compile
      mode: reduce-overhead
      dynamic: false
      options:
        backend: inductor
      min_speedup: 1.000001

benchmark:
  warmup: 1
  iterations: 3

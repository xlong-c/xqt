project:
  name: operator_torch_compile_cuda
  artifact_dir: artifacts/xqt/operator/torch_compile/cuda
model:
  target: torch.nn.Linear
  params:
    in_features: 8
    out_features: 2
  dtype: float32
  device: cuda
benchmark:
  warmup: 1
  iterations: 3
compression_axes:
- precision
hardware:
  device: cuda
  backends:
  - torch_compile
stages:
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: model
      backend: torch_compile
      mode: reduce-overhead
      dynamic: false
      options:
        backend: inductor
      min_speedup: 1.000001
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 1
    iterations: 3

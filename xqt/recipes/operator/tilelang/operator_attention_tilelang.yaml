project:
  name: operator_tilelang_attention
  artifact_dir: artifacts/xqt/operator/tilelang/attention
model:
  target: xqt.model.toy_models.build_toy_attention_classifier
  params:
    hidden_dim: 8
    num_heads: 2
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cuda
  backends:
  - tilelang
stages:
- name: optimize_operators
  kind: operator
  params:
    default_engine: tilelang
    targets:
    - name: attention_tilelang
      target: attention_block
      engine: tilelang
      patterns:
      - attention
      tilelang:
        target_arch: null
        cache_dir: /tmp/xqt_tilelang_cache
        pass_configs:
          TL_ENABLE_FAST_MATH: true
      min_speedup: 1.15
      validate:
        atol: 0.001
        rtol: 0.001
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

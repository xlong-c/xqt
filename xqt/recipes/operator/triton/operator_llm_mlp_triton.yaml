project:
  name: operator_triton_llm_mlp
  artifact_dir: artifacts/xqt/operator/triton/llm_mlp

model:
  target: xqt.operator_opt.toy_models.build_toy_llm_mlp_classifier
  params:
    hidden_dim: 8
    intermediate_dim: 16
    num_classes: 2

compression:
  axes:
    - precision

operator_optimization:
  enabled: true
  default_backend: triton
  targets:
    - name: mlp_triton
      target: mlp
      backend: triton
      patterns:
        - swiglu
      min_speedup: 1.10
      validate:
        atol: 1.0e-4
        rtol: 1.0e-4

validation:
  output_diff:
    atol: 1.0e-4
    rtol: 1.0e-4

benchmark:
  warmup: 0
  iterations: 1

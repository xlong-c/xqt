project:
  name: operator_cutlass_mlp
  artifact_dir: artifacts/xqt/operator/cutlass/mlp
model:
  target: xqt.operator_opt.toy_models.build_toy_llm_mlp_classifier
  params:
    hidden_dim: 8
    intermediate_dim: 16
    num_classes: 2
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- precision
hardware:
  device: cuda
  backends:
  - cutlass
stages:
- name: optimize_operators
  kind: operator
  params:
    targets:
    - name: mlp_cutlass
      target: mlp
      engine: cutlass
      patterns:
      - gemm_epilogue
      min_speedup: 1.1
      validate:
        atol: 1e-4
        rtol: 1e-4
      cutlass:
        target_arch: sm_89
        cache_dir: /tmp/xqt-cutlass-cache
        pass_configs:
          CUTLASS_ENABLE_EPILOGUE_FUSION: true
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

project:
  name: smoke_cpu
  artifact_dir: artifacts/xqt/smoke/cpu

model:
  target: torch.nn.Linear
  params:
    in_features: 4
    out_features: 2

compression:
  axes:
    - precision
    - sparsity
  prune:
    enabled: true
    target_sparsity: 0.5

export:
  targets:
    - format: torch_export
      output_path: artifacts/xqt/smoke/cpu/model.pt2
      params:
        validate: true
        runtime_diff: true

benchmark:
  warmup: 0
  iterations: 1

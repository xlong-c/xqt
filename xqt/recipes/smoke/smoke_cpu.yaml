config_version: 1

project:
  name: smoke_cpu
  artifact_dir: artifacts/xqt/smoke/cpu

model:
  target: torch.nn.Linear
  params:
    in_features: 4
    out_features: 2
  dtype: float32
  device: cpu

compression:
  axes:
    - precision
    - sparsity
  prune:
    enabled: true
    method: global_l1_unstructured
    target_sparsity: 0.5

export:
  targets:
    - format: torch_export
      output_path: artifacts/xqt/smoke/cpu/model.pt2
      params:
        validate: true
        runtime_diff: true

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.01

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

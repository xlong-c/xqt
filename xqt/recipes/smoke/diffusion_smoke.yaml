project:
  name: diffusion_smoke
  artifact_dir: artifacts/xqt/smoke/diffusion
model:
  target: xqt.model.build_smoke_diffusion_denoiser
  params:
    input_dim: 8
    hidden_dim: 16
    num_layers: 2
task:
  type: diffusion
  sampling_steps: 4
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- sparsity
hardware:
  device: cpu
  backends: []
stages:
- name: prune_model
  kind: prune
  params:
    method: global_l1_unstructured
    target_sparsity: 0.2
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

project:
  name: multimodal_smoke
  artifact_dir: artifacts/xqt/smoke/multimodal
model:
  target: xqt.model.build_smoke_multimodal_classifier
  params:
    image_channels: 3
    image_size: 16
    vision_hidden: 16
    text_hidden: 16
    num_classes: 4
task:
  type: multimodal
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- sparsity
hardware:
  device: cpu
  backends: []
stages:
- name: prune_model
  kind: prune
  params:
    method: global_l1_unstructured
    target_sparsity: 0.2
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

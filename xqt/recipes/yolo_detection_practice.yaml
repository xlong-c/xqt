config_version: 1

project:
  name: yolo_detection_practice
  artifact_dir: artifacts/xqt/yolo_detection_practice

model:
  target: xqt.model.build_ultralytics_detection_module
  params:
    weights: yolo11n.pt
  dtype: float32
  device: cpu

task:
  type: detection
  detection_postprocess:
    format: yolo_raw
    box_format: cxcywh
    score_threshold: 0.25
    iou_threshold: 0.45
    max_detections: 300
    score_activation: sigmoid
    has_objectness: false
    class_agnostic_nms: false
  detection_metric:
    iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
    max_detections: 100
  params:
    ultralytics_model: yolo11n.pt
    dataset_yaml: coco8.yaml
    imgsz: 640
    calibration_fraction: 0.5

data:
  calibration:
    target: ultralytics_detection
    sample_limit: 2
    batch_size: 1
    params:
      dataset: coco8.yaml
      subset: train
      autodownload: true
      image_size: [640, 640]
  validation:
    target: ultralytics_detection
    sample_limit: 4
    batch_size: 1
    params:
      dataset: coco8.yaml
      subset: val
      autodownload: true
      image_size: [640, 640]

compression:
  axes:
    - precision
  quant:
    enabled: true
    backend: onnxruntime_qdq
    strategy: static_int8
    calibration_split: calibration
    validation_split: validation
    policy:
      source_name: yolo11n_source.onnx
      output_path: artifacts/xqt/yolo_detection_practice/yolo11n_qdq.onnx
      input_names: [images]
      output_names: [predictions]
      dynamo: false
      sample_limit: 2
      activation_type: QUInt8
      weight_type: QInt8
      op_types_to_quantize: [Conv, MatMul, Gemm]
      extra_options:
        ActivationSymmetric: false
  prune:
    enabled: false
  distill:
    enabled: false
  diffusion_distill:
    enabled: false

operator_optimization:
  enabled: true
  default_backend: torch_compile
  targets:
    - name: model
      backend: torch_compile
      mode: reduce-overhead
      fullgraph: false
      min_speedup: 1.01
      validate:
        atol: 5.0e-2
        rtol: 5.0e-2
    - name: backbone
      backend: deployment_backend
      options:
        runtime: onnxruntime
        stage: export_profile
        semantic_target: backbone
    - name: neck
      backend: deployment_backend
      options:
        runtime: onnxruntime
        stage: export_profile
        semantic_target: neck
    - name: head
      backend: deployment_backend
      options:
        runtime: onnxruntime
        stage: export_profile
        semantic_target: head
    - name: postprocess
      backend: deployment_backend
      options:
        runtime: external_postprocess
        stage: decode_nms
        semantic_target: decode_nms
        fallback_reason: postprocess optimization is validated through decoded detection diff

export:
  targets:
    - format: onnx
      output_path: artifacts/xqt/yolo_detection_practice/yolo11n_fp32.onnx
      opset: 18
      params:
        input_names: [images]
        output_names: [predictions]
        dynamo: false
        runtime_diff: false
    - format: tensorrt
      output_path: artifacts/xqt/yolo_detection_practice/yolo11n_int8.engine
      precision: int8
      profiles:
        images:
          min: [1, 3, 640, 640]
          opt: [1, 3, 640, 640]
          max: [1, 3, 640, 640]
      params:
        dry_run: true
        performance_thresholds:
          throughput_qps_min: 1.0
          latency_p99_ms_max: 50.0
          gpu_compute_time_p99_ms_max: 50.0
    - format: openvino
      output_path: artifacts/xqt/yolo_detection_practice/yolo11n_int8.xml
      precision: int8
      params:
        dry_run: true
        input_shape: [1, 3, 640, 640]

validation:
  output_diff:
    atol: 5.0e-2
    rtol: 5.0e-2
  metric:
    name: map50_95
    max_drop: 0.10

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

config_version: 1

project:
  name: prune_block_sparse_benchmark
  artifact_dir: artifacts/xqt/prune/block_sparse/benchmark

model:
  target: torch.nn.Linear
  params:
    in_features: 16
    out_features: 8
  dtype: float32
  device: cpu

data:
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      input_shape: [16]
      num_classes: 8
      seed: 41

compression:
  axes:
    - sparsity
  prune:
    enabled: true
    method: block_sparse
    target_sparsity: 0.5
    selection:
      block_shape: [2, 2]
    params:
      include_module_types:
        - Linear

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.2

benchmark:
  warmup: 0
  iterations: 2
  percentiles: [50, 90, 99]

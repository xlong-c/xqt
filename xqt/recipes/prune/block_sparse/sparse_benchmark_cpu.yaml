project:
  name: prune_block_sparse_benchmark
  artifact_dir: artifacts/xqt/prune/block_sparse/benchmark

model:
  target: torch.nn.Linear
  params:
    in_features: 16
    out_features: 8

compression:
  axes:
    - sparsity
  prune:
    enabled: true
    method: block_sparse
    target_sparsity: 0.5
    selection:
      block_shape: [2, 2]
    params:
      include_module_types:
        - Linear

benchmark:
  warmup: 0
  iterations: 2

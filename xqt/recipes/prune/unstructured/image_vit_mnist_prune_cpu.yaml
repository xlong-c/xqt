project:
  name: prune_unstructured_vit_mnist
  artifact_dir: artifacts/xqt/prune/unstructured/vit_mnist
model:
  target: xdl.model.vit_tiny_patch16_224
  params:
    num_classes: 10
    in_channels: 1
    dropout: 0.0
    attn_dropout: 0.0
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- sparsity
hardware:
  device: cpu
  backends: []
stages:
- name: prune_model
  kind: prune
  params:
    target_sparsity: 0.5
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

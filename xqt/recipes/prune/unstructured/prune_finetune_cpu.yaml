config_version: 1

project:
  name: prune_unstructured_finetune
  artifact_dir: artifacts/xqt/prune/unstructured/finetune

model:
  target: torch.nn.Linear
  params:
    in_features: 4
    out_features: 2
  dtype: float32
  device: cpu

data:
  train:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      seed: 13
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      seed: 17

compression:
  axes:
    - sparsity
  prune:
    enabled: true
    method: global_l1_unstructured
    target_sparsity: 0.5
    schedule: linear
    params:
      steps: 2
      finetune: true
      kd_steps_per_prune: 1
      lr: 1.0e-2
      weight_decay: 0.0

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.05

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]

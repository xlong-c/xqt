project:
  name: prune_structured_cnn
  artifact_dir: artifacts/xqt/prune/structured/cnn
model:
  target: xqt.prune.StructuredPruningToyCNN
  params:
    in_channels: 3
    hidden_channels: 8
    out_channels: 16
    num_classes: 4
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- width
- sparsity
hardware:
  device: cpu
  backends: []
stages:
- name: prune_model
  kind: prune
  params:
    method: structured
    granularity: channel
    target_sparsity: 0.25
    importance:
      metric: l1
    selection:
      min_keep: 1
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

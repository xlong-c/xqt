project:
  name: prune_structured_vit
  artifact_dir: artifacts/xqt/prune/structured/vit
model:
  target: xdl.model.VisionTransformer
  params:
    img_size: 32
    patch_size: 8
    num_classes: 5
    in_channels: 3
    embed_dim: 32
    depth: 4
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    attn_dropout: 0.0
benchmark:
  warmup: 0
  iterations: 1
compression_axes:
- width
- depth
- sparsity
hardware:
  device: cpu
  backends: []
stages:
- name: prune_model
  kind: prune
  params:
    method: structured
    granularity: mlp_neuron
    scope: per_layer
    target_sparsity: 0.25
    importance:
      metric: l2
    selection:
      min_keep: 1
- name: benchmark_model
  kind: benchmark
  params:
    warmup: 0
    iterations: 1

config_version: 1

project:
  name: prune_structured_vit
  artifact_dir: artifacts/xqt/prune/structured/vit

model:
  target: xdl.model.VisionTransformer
  params:
    img_size: 32
    patch_size: 8
    num_classes: 5
    in_channels: 3
    embed_dim: 32
    depth: 4
    num_heads: 4
    mlp_ratio: 2.0
    dropout: 0.0
    attn_dropout: 0.0
  dtype: float32
  device: cpu

data:
  validation:
    target: synthetic_classification
    sample_limit: 8
    batch_size: 2
    params:
      input_shape: [3, 32, 32]
      num_classes: 5
      seed: 29

compression:
  axes:
    - width
    - depth
  prune:
    enabled: true
    method: structured
    granularity: mlp_neuron
    scope: per_layer
    target_sparsity: 0.25
    importance:
      metric: l2
    selection:
      min_keep: 1

validation:
  output_diff:
    atol: 1.0e-5
    rtol: 1.0e-5
  metric:
    name: top1
    max_drop: 0.2

benchmark:
  warmup: 0
  iterations: 1
  percentiles: [50, 90, 99]
